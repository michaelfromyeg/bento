<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>~/</title>
        <link rel="icon" type="image/png" href="assets/icons/favicon.png" />

        <!-- Apply the saved theme before first paint to avoid a flash. -->
        <script>
            try {
                if (localStorage.getItem("darkTheme") === "enabled") {
                    document.documentElement.classList.add("darktheme");
                }
            } catch {}
        </script>

        <link rel="stylesheet" href="app.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700;800&display=swap"
            rel="stylesheet"
        />

        <script
            defer
            src="https://unpkg.com/lucide@1.69.0/dist/umd/lucide.min.js"
        ></script>
        <script type="module" src="assets/js/main.js"></script>
    </head>

    <body>
        <button id="themeButton" aria-label="Toggle dark theme"></button>

        <div class="container">
            <div class="timeBlock">
                <div class="clock">
                    <div id="hour"></div>
                    <div id="separator">:</div>
                    <div id="minutes"></div>
                </div>
                <div id="greetings"></div>
            </div>

            <div class="weatherBlock">
                <div class="date">
                    <div id="month"></div>
                    <div id="day"></div>
                </div>
                <div class="weather">
                    <div class="weatherIcon">
                        <img src="assets/icons/Nord/unknown.png" alt="" />
                    </div>
                    <div class="weatherValue">
                        <p>-°<span>c</span></p>
                    </div>
                    <div class="weatherDescription">
                        <p></p>
                    </div>
                </div>
            </div>

            <div class="buttons" id="buttonsContainer"></div>
            <div class="card list list__1" id="list_1"></div>
            <div class="card list list__2" id="list_2"></div>
        </div>
    </body>
</html>
